[project]
name = "fitfolio"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "aiofiles>=25.1.0",
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "celery[redis]>=5.6.3",
    "dependency-injector>=4.49.1",
    "fastapi[standard]>=0.138.0",
    "greenlet>=3.5.2",
    "langchain>=1.2.0",
    "langchain-google-genai>=4.2.5",
    "langfuse>=4.12.0",
    "langgraph>=1.2.6",
    "pydantic-settings>=2.14.2",
    "pymupdf>=1.27.2.3",
    "python-docx>=1.2.0",
    "sqlalchemy>=2.0.51",
    "streamlit>=1.58.0",
    "trafilatura>=2.1.0",
]

[tool.ruff]
line-length = 120

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pyrefly>=1.1.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.19",
    "watchfiles>=1.2.0",
]
